<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面目录</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: rgba(255, 255, 255, 0.96);
      --border: #dbe5f0;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%), linear-gradient(180deg, #f8fbff, var(--bg));
      color: var(--text);
    }
    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      align-items: start;
      min-height: 100vh;
    }
    .sidebar, .preview {
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }
    .sidebar {
      padding: 18px 16px;
      position: sticky;
      top: 18px;
    }
    .sidebar h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
    }
    .sidebar p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .tree {
      display: grid;
      gap: 14px;
    }
    .tree-group {
      display: grid;
      gap: 6px;
    }
    .tree-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      background: #f8fbff;
      border: 1px solid var(--border);
      user-select: none;
    }
    .tree-toggle:hover {
      border-color: rgba(37, 99, 235, 0.22);
    }
    .tree-caret {
      color: var(--muted);
      font-size: 12px;
    }
    .tree-items {
      display: grid;
      gap: 4px;
      padding-left: 12px;
    }
    .tree-items.collapsed {
      display: none;
    }
    .tree-item {
      display: grid;
      gap: 2px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: .2s ease;
      user-select: none;
    }
    .tree-item:hover {
      background: #f8fbff;
      border-color: rgba(37, 99, 235, 0.16);
    }
    .tree-item.active {
      background: var(--blue-soft);
      border-color: rgba(37, 99, 235, 0.26);
    }
    .tree-item strong {
      font-size: 14px;
      font-weight: 700;
    }
    .tree-item span {
      color: var(--muted);
      font-size: 12px;
    }
    .preview {
      min-height: calc(100vh - 36px);
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    iframe {
      width: 100%;
      min-height: calc(100vh - 36px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: white;
    }
    @media (max-width: 1100px) {
      .shell {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      iframe {
        min-height: 780px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <h1>项目管理平台</h1>
      <p>页面目录</p>
      <div class="tree">
        <section class="tree-group">
          <div class="tree-toggle" data-target="overview-group">
            <span>总览</span>
            <span class="tree-caret">▾</span>
          </div>
          <div id="overview-group" class="tree-items">
            <div class="tree-item active" data-src="/files/preview-project-overview-clean.html" data-name="项目总览">
              <strong>项目总览</strong>
              <span>先看重点项目和推进总表</span>
            </div>
            <div class="tree-item" data-src="/files/preview-broker-overview-clean.html" data-name="券商总览">
              <strong>券商总览</strong>
              <span>再看单家券商的多项目协同</span>
            </div>
          </div>
        </section>
        <section class="tree-group">
          <div class="tree-toggle" data-target="execution-group">
            <span>执行</span>
            <span class="tree-caret">▾</span>
          </div>
          <div id="execution-group" class="tree-items">
            <div class="tree-item" data-src="/files/preview-tasks-clean.html" data-name="协作任务 / 我的待办">
              <strong>协作任务 / 我的待办</strong>
              <span>任务池与个人待办并列</span>
            </div>
            <div class="tree-item" data-src="/files/preview-schedule-clean.html" data-name="排期中心">
              <strong>排期中心</strong>
              <span>升级包、测试、上线窗口</span>
            </div>
            <div class="tree-item" data-src="/files/preview-issues-clean.html" data-name="问题中心">
              <strong>问题中心</strong>
              <span>风险、阻塞、关闭结果</span>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <section class="preview">
      <iframe id="preview-frame" src="/files/preview-project-overview-clean.html" title="页面预览"></iframe>
    </section>
  </div>

  <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.tree-item'));
      var toggles = Array.prototype.slice.call(document.querySelectorAll('.tree-toggle'));
      var frame = document.getElementById('preview-frame');
      function activate(item) {
        items.forEach(function (node) {
          node.classList.toggle('active', node === item);
        });
        var src = item.getAttribute('data-src');
        frame.src = src;
      }

      items.forEach(function (item) {
        item.addEventListener('click', function () {
          activate(item);
        });
      });

      toggles.forEach(function (toggle) {
        toggle.addEventListener('click', function () {
          var target = document.getElementById(toggle.getAttribute('data-target'));
          var caret = toggle.querySelector('.tree-caret');
          if (!target) return;
          target.classList.toggle('collapsed');
          caret.textContent = target.classList.contains('collapsed') ? '▸' : '▾';
        });
      });
    })();
  </script>
</body>
</html>

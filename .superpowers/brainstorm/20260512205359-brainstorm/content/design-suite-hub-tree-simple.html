<style>
  :root {
    --bg: #eef3f8;
    --panel: rgba(255, 255, 255, 0.96);
    --border: #dbe5f0;
    --text: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
  }

  body {
    background:
      radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
      linear-gradient(180deg, #f8fbff, var(--bg));
  }

  .shell {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  .sidebar,
  .preview {
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
  }

  .sidebar {
    padding: 18px 16px;
    position: sticky;
    top: 20px;
  }

  .sidebar h1 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 24px;
  }

  .sidebar p {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }

  .tree {
    display: grid;
    gap: 12px;
  }

  .tree-group {
    display: grid;
    gap: 8px;
  }

  .tree-group-title {
    padding: 6px 10px 0;
    color: #64748b;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .tree-items {
    display: grid;
    gap: 4px;
  }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .tree-item:hover {
    background: #f8fbff;
  }

  .tree-item.active {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.14), rgba(59, 130, 246, 0.08));
    color: #0f172a;
    border: 1px solid rgba(37, 99, 235, 0.18);
  }

  .tree-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #cbd5e1;
    flex: 0 0 auto;
  }

  .tree-item.active .tree-dot {
    background: var(--blue);
  }

  .preview {
    padding: 18px;
    display: grid;
    gap: 12px;
  }

  .preview-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }

  .preview-title {
    color: var(--text);
    font-size: 18px;
    font-weight: 800;
  }

  .preview-sub {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
  }

  .ghost-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border-radius: 12px;
    color: #334155;
    background: #fff;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
  }

  .frame {
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #fff;
    min-height: 780px;
  }

  .frame iframe {
    width: 100%;
    height: 780px;
    border: 0;
    display: block;
    background: #fff;
  }
</style>

<div class="shell">
  <aside class="sidebar">
    <h1>页面目录</h1>
    <p>左边只保留树状目录，不再用大卡片和大横幅，整体会更像真实系统里的内部设计导航。</p>

    <div class="tree">
      <div class="tree-group">
        <div class="tree-group-title">总览</div>
        <div class="tree-items">
          <div class="tree-item active" data-src="/files/overview-dual-dashboard.html" data-name="项目总览 / 券商总览">
            <span class="tree-dot"></span>
            <span>项目总览 / 券商总览</span>
          </div>
        </div>
      </div>

      <div class="tree-group">
        <div class="tree-group-title">执行</div>
        <div class="tree-items">
          <div class="tree-item" data-src="/files/tasks-workbench.html" data-name="协作任务 / 我的待办">
            <span class="tree-dot"></span>
            <span>协作任务 / 我的待办</span>
          </div>
          <div class="tree-item" data-src="/files/scheduling-center.html" data-name="排期中心">
            <span class="tree-dot"></span>
            <span>排期中心</span>
          </div>
          <div class="tree-item" data-src="/files/issue-center.html" data-name="问题中心">
            <span class="tree-dot"></span>
            <span>问题中心</span>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <section class="preview">
    <div class="preview-bar">
      <div>
        <div id="preview-title" class="preview-title">项目总览 / 券商总览</div>
        <div class="preview-sub">这一版的特点是目录极简，只留下树，不再保留“统一展示入口 / 五张核心页面”那种大面积说明区。</div>
      </div>
      <a id="open-current" class="ghost-btn" href="/files/overview-dual-dashboard.html" target="_blank" rel="noreferrer">新窗口打开</a>
    </div>

    <div class="frame">
      <iframe id="preview-frame" src="/files/overview-dual-dashboard.html" title="design preview"></iframe>
    </div>
  </section>
</div>

<script>
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.tree-item'));
    var frame = document.getElementById('preview-frame');
    var title = document.getElementById('preview-title');
    var openCurrent = document.getElementById('open-current');

    function activate(item) {
      items.forEach(function (node) {
        node.classList.toggle('active', node === item);
      });
      var src = item.getAttribute('data-src');
      var name = item.getAttribute('data-name');
      frame.src = src;
      title.textContent = name;
      openCurrent.href = src;
    }

    items.forEach(function (item) {
      item.addEventListener('click', function () {
        activate(item);
      });
    });
  })();
</script>
